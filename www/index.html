<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- bilibili 图床对"非 bilibili 的 Referer"直接 403，不发 Referer 才给图 -->
<meta name="referrer" content="no-referrer">
<title>播客</title>
<meta name="theme-color" content="#171a21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 状态栏颜色用 iOS 15+ 支持的 theme-color 控制（见下面那几个 meta），
     不要用 black-translucent：那会让 WebView 铺到状态栏底下，顶栏还要再加
     env(safe-area-inset-top) 的 padding，实际机型上会出现状态栏和按钮之间
     空出一大截的问题。default 让系统把页面排在状态栏下面，布局最稳。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="播客">
<script>
// 先定主题再加载样式表，避免浅色模式下先闪一下深色。
// 这段必须内联在 head 里：app.js 在 body 末尾，那时已经画出来了。
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('podcast.settings') || '{}');
    var t = s.theme || 'auto';
    if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { /* 读不到就按深色画，app.js 起来后会纠正 */ }
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶栏和工具栏合成一个 fixed 浮层（.bars）：列表从它们底下滚过，
     毛玻璃才看得到内容。高度由 app.js 量成 --top-h 让列表避开。 -->
<div id="bars" class="bars">
  <header class="top">
    <div class="top-right">
      <span id="status" class="status"></span>
    </div>
  </header>

  <div class="toolbar">
    <button id="theme" class="icon-btn" title="主题"><span id="themeIco" class="ico ico-auto"></span></button>
    <select id="feedSel" aria-label="选择订阅源"></select>
    <!-- 排序 / 隐藏已完播 / 最近完播收进一个下拉，点「筛选」才展开 -->
    <div class="filter-wrap">
      <button id="filterBtn" class="icon-btn filter-btn" type="button" title="筛选" aria-label="筛选" aria-haspopup="true" aria-expanded="false"><span class="ico ico-filter"></span></button>
      <div id="filterMenu" class="filter-menu" hidden>
        <button id="sortBtn" class="chip" type="button" aria-label="排序方式"></button>
        <button id="hideBtn" class="chip" type="button" role="switch" aria-checked="true">隐藏已完播</button>
        <button id="doneBtn" class="chip" type="button" role="switch" aria-checked="false">最近完播</button>
      </div>
    </div>
    <button id="refresh" class="icon-btn" title="刷新全部订阅" aria-label="刷新"><span class="ico ico-refresh"></span></button>
  </div>
</div>

<main id="list" class="list" aria-live="polite">
  <div id="sentinel" class="sentinel"></div>
</main>
<div id="empty" class="empty" hidden></div>

<!-- 媒体元素必须真实存在于文档里：iOS「添加到主屏幕」的 PWA 切到后台时，
     脱离文档的 new Audio() 会被系统挂起/掐掉 —— 音频停、锁屏面板消失，
     前后跳和暂停后再播也一起失效。放在 footer 外面，免得播放器收起时
     footer 的 hidden 把媒体元素一起藏掉。 -->
<audio id="player-audio" preload="metadata"></audio>

<footer id="player" class="player" hidden>
  <div class="pl-top">
    <img id="plImg" class="pl-img" alt="" referrerpolicy="no-referrer">
    <div class="pl-info">
      <div id="plTitle" class="pl-title"></div>
      <div id="plSub" class="pl-sub"></div>
    </div>
    <button id="plClose" class="icon-btn" title="关闭播放器" aria-label="关闭"><span class="ico ico-close"></span></button>
  </div>

  <input id="plSeek" class="pl-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">

  <div class="pl-row">
    <span id="plTime" class="pl-time">0:00 / 0:00</span>
    <div class="pl-btns">
      <button id="plBack" class="icon-btn" title="后退 10 秒" aria-label="后退 10 秒"><span class="ico ico-replay"></span></button>
      <button id="plPlay" class="play-btn" title="播放/暂停" aria-label="播放"><span id="plIcon" class="ico ico-play"></span></button>
      <button id="plFwd" class="icon-btn" title="前进 30 秒" aria-label="前进 30 秒"><span class="ico ico-forward"></span></button>
      <!-- 倍速：点这个数字，在上方弹出预设列表 -->
      <div class="speed-wrap">
        <button id="plSpeed" class="speed-btn" title="倍速" aria-label="播放倍速" aria-haspopup="menu" aria-expanded="false">2×</button>
        <div id="speedMenu" class="speed-menu" role="menu" aria-label="播放倍速" hidden></div>
      </div>
    </div>
  </div>

  <div id="speedEdit" class="speed-edit" hidden>
    <div class="speed-edit-hint">倍速预设（逗号分隔，0.5–4，最多 12 个）</div>
    <input id="speedInput" class="speed-input" type="text" inputmode="decimal"
           autocomplete="off" spellcheck="false" aria-label="倍速预设列表">
    <div class="speed-edit-row">
      <span id="speedErr" class="speed-err" role="alert"></span>
      <button id="speedCancel" class="chip" type="button">取消</button>
      <button id="speedSave" class="chip on" type="button">保存</button>
    </div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
