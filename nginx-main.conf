# 替代 nginx:alpine 自带的 /etc/nginx/nginx.conf。
#
# 只有一处实质改动：worker 进程的用户。镜像默认是 `user nginx;`（uid 101），
# 而挂载进来的同步目录属于宿主机用户（uid 1000），worker 写不进去会直接 500。
# hostuser 由 podcast/Dockerfile 建出来，uid/gid 与宿主机用户一致，
# 这样 bind mount 不需要 chown / chmod / ACL，新建的同步文件也归宿主机用户所有。
#
# 注意：Dockerfile 里的 1000 要和 `id -u` / `id -g` 对得上。

user hostuser hostuser;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志直接进容器 stdout/stderr，跟其他服务一样用 docker logs 看
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # 镜像里这几个临时目录归 uid 101，worker 降权后写不了；
    # PUT 同步数据超过 client_body_buffer_size 就会落到这里。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
