# 极简播客客户端：托管 PWA 静态文件，并把 podsync 反代到同源 /feeds/ 下。
#
# 为什么必须反代，而不是让前端直连 100.97.117.78:8000：
#   1. podsync 不返回 Access-Control-Allow-Origin，跨源 fetch 直接被浏览器拦
#   2. feed 里的 enclosure 是写死的 http://100.97.117.78:8000/xxx.mp3，
#      从 HTTPS 页面直连属于混合内容，同样被拦
# 同源反代后这两个问题一起消失，音频的 Range 请求也能正常透传。
#
# 容器用 host 网络（见 docker-compose.yml），所以直接监听宿主机回环，
# 回源走 podsync 发布的 127.0.0.1:8000 —— podsync 容器被重建换 IP 也不受影响。

server {
    # 回环：给 tailscale serve 的 HTTPS 入口用（PWA 的 service worker 需要安全上下文）
    listen 127.0.0.1:8100;
    # Tailscale IP 上的同一个端口：方便直接用 http://100.97.117.78:8100 访问，
    # 不用敲一长串 ts.net 域名。只绑这个地址，不铺到局域网。
    # 代价：这个入口是明文 HTTP、不是安全上下文，service worker 装不上 ——
    # 也就是没有离线缓存、没有"安装到桌面"。要装成 App 请走上面的 HTTPS 入口。
    listen 100.97.117.78:8100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # podsync 的 feed 是纯文本 XML，一个就有 1MB+，压了能省 5-8 倍带宽。
    # 注意 Content-Type 是 text/xml（不是 application/xml），两个都得列；
    # gzip_proxied any 是必须的 —— 默认 off，会让 /feeds/ 反代的响应完全不被压缩。
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/manifest+json
               text/xml application/xml text/plain image/svg+xml;

    # 静态资源一律 no-cache（可以存，但每次都得用 ETag 回源确认）。
    # 必须写在这里而不是 location = / —— 请求 / 会被 index 内部改写成 /index.html，
    # add_header 取的是最终命中那个 location 的，写在 = / 里等于没写，
    # 结果 index.html / app.js 只能吃到启发式缓存，浏览器拿着旧的代码不回来问。
    # 带 ETag 的话回源只是一次 304，代价很小。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # /feeds/podsync.opml  ->  http://127.0.0.1:8000/podsync.opml
    # /feeds/B7_GG101/x.mp3 ->  http://127.0.0.1:8000/B7_GG101/x.mp3
    location /feeds/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 音频边下边放、支持拖动跳转：不能先缓冲到磁盘再发
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 外部订阅（晚点聊、硅谷101 等）：列表只在 external-feeds.tsv 里维护，
    # 容器启动时由 gen-external-feeds.sh 生成 location 片段后 include 进来，
    # 加源不用再改这个文件。每个源的反代路径是 /ext/<id>/rss。
    include /etc/nginx/external-feeds.locations.conf;

    # 同一份列表也发给客户端，App 据此生成订阅项（见 app.js 的 loadIndex）。
    location = /external-feeds.tsv {
        alias /etc/nginx/external-feeds.tsv;
        default_type text/tab-separated-values;
        add_header Cache-Control "no-cache" always;
    }

    # 本地 TTS 音频（index-tts 生成，宿主机上由 tts_podcast_server.py 生成 feed）。
    # feed 走反代：那个 server 是单线程的 HTTPServer，让它去扛几十 MB 的 wav
    # 会把并发的 feed 请求一起堵死；音频文件改由 nginx 直接读只读挂载目录，
    # 顺带拿到 Range 支持，70MB 的 wav 也能拖动跳转。
    # 挂载见 docker-compose.yml 的 podcast 服务。
    location = /tts/feed.xml {
        proxy_pass http://127.0.0.1:8001/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 上游把 base_url 写死成 http://192.168.1.116:8001，换成同源前缀，
        # 否则 HTTPS 页面里的 enclosure 会被当混合内容拦掉。
        # sub_filter 默认只处理 text/html，RSS 的 MIME 得单独列出来。
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/rss+xml application/xml text/xml;
        sub_filter 'http://192.168.1.116:8001' '/tts';
        sub_filter_once off;
        add_header Cache-Control "no-store" always;
    }

    location /tts/ {
        alias /var/lib/podcast-tts/;
        # nginx 自带的 mime.types 里没有 wav，不写这里会当成 octet-stream
        types {
            audio/wav  wav;
            audio/mpeg mp3;
            audio/mp4  m4a;
            audio/flac flac;
            audio/ogg  ogg;
        }
        add_header Cache-Control "no-cache" always;
    }

    # /thumb?u=<urlencoded 封面地址>  ->  http://127.0.0.1:8101/thumb?u=...
    # 封面交给服务端抓：bilibili 的原图是 1920x1080 的 jpg（100KB+），
    # 而 YouTube 系的图床（i.ytimg.com / yt3.ggpht.com）客户端根本连不上。
    # 缩略图服务自己带 immutable 缓存头（同一个 URL 出同一张图），这里不用再 add_header，
    # 上游的 Cache-Control 原样透传即可。
    location /thumb {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 跨设备同步存储：每台设备 PUT 一个 sync 文件，前端拉全部再按逻辑版本合并。
    # 用 nginx 自带的 WebDAV（--with-http_dav_module），省一个后端服务。
    # 只开 PUT，不开 DELETE —— 写坏的后果最多是那台设备的数据被覆盖。
    location /sync/ {
        alias /var/lib/podcast-sync/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;
        client_max_body_size 8m;

        # 设备发现靠列目录，用 JSON 格式免得解析 HTML
        autoindex on;
        autoindex_format json;
        default_type application/json;

        # 同步数据必须每次拿最新的，不能被缓存
        add_header Cache-Control "no-store" always;
    }
}
