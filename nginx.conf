# 极简播客客户端：托管 PWA 静态文件，并把 podsync 反代到同源 /feeds/ 下。
#
# 为什么必须反代，而不是让前端直连 100.97.117.78:8000：
#   1. podsync 不返回 Access-Control-Allow-Origin，跨源 fetch 直接被浏览器拦
#   2. feed 里的 enclosure 是写死的 http://100.97.117.78:8000/xxx.mp3，
#      从 HTTPS 页面直连属于混合内容，同样被拦
# 同源反代后这两个问题一起消失，音频的 Range 请求也能正常透传。
#
# 容器用 host 网络（见 docker-compose.yml），所以直接监听宿主机回环，
# 回源走 podsync 发布的 127.0.0.1:8000 —— podsync 容器被重建换 IP 也不受影响。

server {
    listen 127.0.0.1:8100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json application/xml;

    # 入口和 sw.js 不缓存，改完刷新就能看到
    location = / {
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /feeds/podsync.opml  ->  http://127.0.0.1:8000/podsync.opml
    # /feeds/B7_GG101/x.mp3 ->  http://127.0.0.1:8000/B7_GG101/x.mp3
    location /feeds/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 音频边下边放、支持拖动跳转：不能先缓冲到磁盘再发
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 跨设备同步存储：每台设备 PUT 一个 sync 文件，前端拉全部再按时间戳合并。
    # 用 nginx 自带的 WebDAV（--with-http_dav_module），省一个后端服务。
    # 只开 PUT，不开 DELETE —— 写坏的后果最多是那台设备的数据被覆盖。
    location /sync/ {
        alias /var/lib/podcast-sync/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;
        client_max_body_size 8m;

        # 设备发现靠列目录，用 JSON 格式免得解析 HTML
        autoindex on;
        autoindex_format json;
        default_type application/json;

        # 同步数据必须每次拿最新的，不能被缓存
        add_header Cache-Control "no-store" always;
    }
}
